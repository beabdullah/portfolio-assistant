<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riz — Abdullah Rizwan's AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar / Header -->
    <header class="header">
      <div class="brand">
        <div class="avatar">R</div>
        <div class="brand-text">
          <h1>Riz</h1>
          <span class="status"><span class="dot"></span> Online • Abdullah's AI Assistant</span>
        </div>
      </div>
      <button id="clearBtn" class="icon-btn" title="Clear conversation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </button>
    </header>

    <!-- Chat Area -->
    <main class="chat" id="chat">
      <!-- Welcome message injected by JS -->
    </main>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="suggestions" id="suggestions">
        <button class="chip">Who is Abdullah?</button>
        <button class="chip">What are his skills?</button>
        <button class="chip">Show experience</button>
        <button class="chip">What services does he offer?</button>
        <button class="chip">How can I contact him?</button>
      </div>
      <form id="chatForm" class="input-row">
        <input
          type="text"
          id="userInput"
          placeholder="Ask me anything about Abdullah..."
          autocomplete="off"
          required
        />
        <button type="submit" id="sendBtn" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <p class="disclaimer">Powered by OpenRouter • Responses based on Abdullah's portfolio</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
